name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (schema, resolver, generator, security, scripts, drift)
        run: bun test packages tests
      - name: Device parser / safety tests (no device required)
        run: node --test scripts/runtime/*.node.test.mjs
      - name: Integrity classifier tests (no SDK)
        run: node --test scripts/integrity/gates.node.test.mjs
      - name: Release APK parser regression tests (no SDK)
        run: node --test scripts/release/native-apk.node.test.mjs
      - name: Deterministic artifact integrity (no SDK)
        run: bun run integrity:check
      - name: Template drift check
        run: bun run templates:check
      - name: Build web app (standalone Node)
        run: bun run build
      - name: Build web app (Vercel SSR adapter)
        run: bun run deploy:check && KOTLAUNCH_DEPLOY_TARGET=vercel bun run build

  android-smoke:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Generate, extract, assembleDebug and run unit tests
        run: bun run scripts/android-smoke.ts
